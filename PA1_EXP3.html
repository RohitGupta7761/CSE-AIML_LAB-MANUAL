
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f6fc;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #1d3557;
        }

        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #333;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #1d3557;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #e8f1fc;
        }

        tr:hover {
            background-color: #d3e5ff;
        }
    </style>
</head>
<body>

    <h1>Student Marks Report</h1>

    <table>
        <tr>
            <th>Name</th>
            <th>HTML</th>
            <th>CSS</th>
            <th>JAVASCRIPT</th>
            <th>Total Marks</th>
            <th>Percentage</th>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>85</td>
            <td>80</td>
            <td>90</td>
            <td>255</td>
            <td>85%</td>
        </tr>

        <tr>
            <td>Priya</td>
            <td>92</td>
            <td>88</td>
            <td>95</td>
            <td>275</td>
            <td>91.67%</td>
        </tr>

        <tr>
            <td>Amit</td>
            <td>78</td>
            <td>82</td>
            <td>85</td>
            <td>245</td>
            <td>81.67%</td>
        </tr>

        <tr>
            <td>Neha</td>
            <td>88</td>
            <td>91</td>
            <td>89</td>
            <td>268</td>
            <td>89.33%</td>
        </tr>

        <tr>
            <td>Karan</td>
            <td>90</td>
            <td>86</td>
            <td>88</td>
            <td>264</td>
            <td>88%</td>
        </tr>
    </table>

</body>
</html>
